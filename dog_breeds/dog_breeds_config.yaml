# Data cleaning paths
data_root: "../data/dog_breed_data"
cleaned_data_path_csv: "../data/dog_breed_data/stanford_dogs_index.csv"
cleaned_data_path_json: "../data/dog_breed_data/stanford_dogs_index.json"
tasks_dir: "../data/dog_breed_data/tasks"

# Image
img_size: 192 # can also try 192
use_bbox: false # can put to true and say I will crop offline
feat_dim: 128

# General Training
random_seed: 42
num_pretrain_dogs: 10
num_cil_dogs_per_task: 1 # can add more to make harder
num_tasks: 3 # can add more to make harder

# Backbone training
backbone_learning_rate: 0.0003 # was 0.0005, can try 0.0001
backbone_epochs: 100
backbone_batch_size_train: 64
backbone_batch_size_val: 64
backbone_img_size: 224
epochs_head_warmup: 3
epochs_finetune: 30
backbone_patience: 7
lr_head: 0.001
lr_finetune: 0.0003
backbone_weight_decay: 0.0001
backbone_label_smoothing: 0.05

# Distillation part 1
cache_dir: "../data/dog_breed_data/offline/" # where train_cache.pt / val_cache.pt live
out_dir: "../data/dog_breed_data/distillation_1/"
feat_dim_student: 128 # needs to match CIL feat_dim
distillation_batch_size_train: 256
distillation_batch_size_val: 256
distillation_epochs: 50
distillation_patience: 8
distillation_lr: 0.0005
distillation_weight_decay: 0.0001
distillation_label_smoothing: 0.05
distillation_alpha_kd: 1.0 # KL distillation weight (teacher logits)
distillation_kd_T: 2.0 # temperature
distillation_alpha_ce: 0.0 # currently turned off
distillation_alpha_feat: 0.0 # currently off, set >0.0 to also match penultimate features (MSE)
distillation_dropout: 0.3

# CIL training
buffer_size: 3000
sparsity_ratio: 0.3
CIL_batch_size_train: 1
replay_batch_size: 1 # tends to match the live batch size, but can tune this
CIL_batch_size_test: 1
CIL_epochs: 5
CIL_learning_rate: 0.001
ddr_kd_weight: 0.5
p_intra: 0.02
p_inter: 0.05
delta_k: 4
cwi_alpha: 1.0
cwi_beta: 1.0
cwi_ema: 0.9 # optional, not in SparCL
metrics_path: "plots_and_metrics/dog_breed_cil_metrics.txt"
plot_dir: "plots_and_metrics"

# If set, only include these breeds (names must match DogInfo.xlsx). Leave empty to keep all.
select_breeds: []
# If set, only include these dog IDs. Leave empty to keep all.
select_dog_ids: []
