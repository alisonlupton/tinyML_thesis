# Data cleaning paths
raw_data_path: "../data/DogMoveData_csv_format/DogMoveData.csv"
dog_info_path: "../data/DogMoveData_csv_format/DogInfo.xlsx"
cleaned_data_path: "../data/DogMoveData_csv_format/DogMoveData_clean.csv"

# Segmenting
min_segment_length: 100

# Windowing
sample_rate_hz: 100 # every 1 second
window_seconds: 1
stride_seconds: .5
flatten_windows: False

# Sensors to use
use_acc: true
use_gyro: true
sensor_locations: ["Back", "Neck"]

# General Training
random_seed: 42
num_pretrain_dogs: 10
# backbone_val_dog: 48
# target_dog: 47
main_behaviors:
  [
    "Standing",
    "Walking",
    "Sitting",
    "Lying chest",
    "Sniffing",
    "Trotting",
    "Galloping",
  ]
backbone_behaviors: ["Standing", "Walking", "Sitting", "Lying chest"]
cil_behaviors: ["Sniffing", "Trotting", "Galloping"]
cil_tasks:
  [
    ["Standing", "Walking", "Sitting", "Lying chest", "Sniffing"],
    ["Standing", "Walking", "Sitting", "Lying chest", "Sniffing", "Trotting"],
    [
      "Standing",
      "Walking",
      "Sitting",
      "Lying chest",
      "Sniffing",
      "Trotting",
      "Galloping",
    ],
  ]

# Backbone training
backbone_learning_rate: 0.001
backbone_weight_decay: 0.0001
backbone_epochs: 50
backbone_batch_size_train: 32
backbone_batch_size_val: 32
backbone_sparsity_ratio: 0.0

# CIL training
buffer_size: 5000
sparsity_ratio: 0.3
CIL_batch_size_train: 1
replay_batch_size: 1 # tends to match the live batch size, but can tune this
CIL_batch_size_test: 1
CIL_epochs: 10
CIL_learning_rate: 0.001
ddr_kd_weight: 0.5
kd_temp: 2.0
p_intra: 0.02
p_inter: 0.05
delta_k: 4
cwi_alpha: 1.0
cwi_beta: 1.0
cwi_ema: 0.9 # optional, not in SparCL
metrics_path: "report_metrics/dog_cil_metrics.txt"
plot_dir: "plots_and_metrics"

# If set, only include these breeds (names must match DogInfo.xlsx). Leave empty to keep all.
select_breeds: []
# If set, only include these dog IDs. Leave empty to keep all.
select_dog_ids: []
